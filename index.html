<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<title>ELEKTRA — Standar Kelistrikan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<style>
:root{
  --bg:#0D1117; --surface:#151C26; --surface2:#1B2431; --line:rgba(180,196,220,.12);
  --text:#E9EEF5; --muted:#8A94A6; --accent:#D98E4A; --accent-soft:rgba(217,142,74,.14);
  --puil:#5B9CFF; --iec:#E9A83C; --nec:#B487F0;
  --ok:#3FBF7F; --err:#E06060;
  --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.28);
}
[data-theme="light"]{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EDF0F5; --line:rgba(23,32,46,.10);
  --text:#17202E; --muted:#5C6675; --accent:#B96F2E; --accent-soft:rgba(185,111,46,.12);
  --shadow:0 6px 20px rgba(23,32,46,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--text);
  transition:background .25s ease,color .25s ease; overscroll-behavior-y:none;
}
.mono{font-family:'IBM Plex Mono',monospace}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:14px 16px calc(12px);background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--accent),#8a5522);
  display:grid;place-items:center;color:#fff;flex-shrink:0}
.logo svg{width:18px;height:18px}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.02em}
.brand p{font-size:10.5px;color:var(--muted)}
.hspace{flex:1}
.pill-toggle{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px}
.pill-toggle button{border:0;background:transparent;color:var(--muted);font:600 11px 'IBM Plex Mono',monospace;
  padding:5px 9px;border-radius:99px;cursor:pointer;transition:all .18s}
.pill-toggle button.on{background:var(--accent);color:#fff}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);
  color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
/* ---------- Tabs / views ---------- */
main{flex:1;padding:16px}
.view{display:none;animation:fadeUp .22s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- Query box ---------- */
.querybox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow)}
.querybox label{font:600 10.5px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.querybox textarea{
  width:100%;margin-top:8px;background:transparent;border:0;outline:0;resize:none;color:var(--text);
  font:400 15px/1.5 'IBM Plex Sans',sans-serif;min-height:52px;max-height:140px}
.qb-foot{display:flex;align-items:center;gap:8px;margin-top:6px}
.src-note{font:400 10.5px 'IBM Plex Mono',monospace;color:var(--muted)}
.ask-btn{margin-left:auto;border:0;border-radius:11px;background:var(--accent);color:#fff;
  font:600 13.5px 'IBM Plex Sans',sans-serif;padding:10px 18px;cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:transform .15s,opacity .2s}
.ask-btn:active{transform:scale(.95)}
.ask-btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;
  font:500 12px 'IBM Plex Sans',sans-serif;padding:7px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;
  transition:border-color .18s,transform .12s}
.chip:active{transform:scale(.95)}
.chip .zap{color:var(--accent)}
/* ---------- Result ---------- */
.result-meta{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;flex-wrap:wrap}
.rid{font:600 12px 'IBM Plex Mono',monospace}
.badge{font:600 9.5px 'IBM Plex Mono',monospace;letter-spacing:.06em;border-radius:6px;padding:3px 7px}
.badge.ai{background:var(--accent-soft);color:var(--accent)}
.badge.local{background:rgba(63,191,127,.14);color:var(--ok)}
.rtime{margin-left:auto;font:500 10.5px 'IBM Plex Mono',monospace;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:12px}
.std-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 14px 14px 18px;box-shadow:var(--shadow);overflow:hidden}
.std-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.std-card.puil{--c:var(--puil)} .std-card.iec{--c:var(--iec)} .std-card.nec{--c:var(--nec)}
.std-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.std-tag{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.07em;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:7px;padding:4px 8px}
.copy-btn{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;border-radius:7px}
.copy-btn:active{color:var(--accent)}
.std-card p.sum{font-size:13.5px;line-height:1.6;color:var(--text)}
.std-card ul{margin:9px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.std-card li{font-size:12.5px;line-height:1.55;color:var(--text)}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ref{font:500 10.5px 'IBM Plex Mono',monospace;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  color:var(--c);border-radius:6px;padding:3px 7px}
.verdict{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.6}
.verdict b{color:var(--accent);font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.07em;display:block;margin-bottom:4px}
/* skeleton */
.skel .sk{background:linear-gradient(90deg,var(--surface2) 25%,color-mix(in srgb,var(--surface2) 60%,var(--surface)) 50%,var(--surface2) 75%);
  background-size:200% 100%;animation:sh 1.1s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.errbox{background:rgba(224,96,96,.1);border:1px solid rgba(224,96,96,.3);color:var(--err);
  border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.55}
/* ---------- History ---------- */
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;
  margin-bottom:10px;cursor:pointer;transition:transform .12s}
.hitem:active{transform:scale(.98)}
.hitem .top{display:flex;gap:8px;align-items:center}
.hitem .hid{font:600 11.5px 'IBM Plex Mono',monospace;color:var(--accent)}
.hitem .hdate{margin-left:auto;font:400 10px 'IBM Plex Mono',monospace;color:var(--muted)}
.hitem .hq{font-size:13.5px;margin-top:5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);text-align:center;font-size:13px;padding:40px 0;line-height:1.6}
/* ---------- Admin ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.field{margin-bottom:10px}
.field label{font:600 10.5px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font:400 13.5px 'IBM Plex Sans',sans-serif;padding:10px 12px;outline:0}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.btn{border:0;border-radius:10px;font:600 13px 'IBM Plex Sans',sans-serif;padding:10px 16px;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(224,96,96,.12);color:var(--err);border:1px solid rgba(224,96,96,.3)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:11px;padding:12px}
.stat .n{font:600 22px 'IBM Plex Mono',monospace}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:2px}
.kbrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.kbrow:last-child{border-bottom:0}
.kbrow .t{font-size:13px;font-weight:500;flex:1}
.kbrow .kw{font:400 10px 'IBM Plex Mono',monospace;color:var(--muted)}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:18px 0}
.pin-dots span{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted);transition:all .15s}
.pin-dots span.f{background:var(--accent);border-color:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
.pinpad button{aspect-ratio:1.5;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
  color:var(--text);font:600 17px 'IBM Plex Mono',monospace;cursor:pointer;transition:transform .1s}
.pinpad button:active{transform:scale(.93);background:var(--accent-soft)}
/* ---------- Bottom nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 0 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10px 'IBM Plex Sans',sans-serif;transition:color .18s}
nav button.on{color:var(--accent)}
nav button svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
  background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:99px;
  font:500 12.5px 'IBM Plex Sans',sans-serif;padding:9px 18px;box-shadow:var(--shadow);
  transition:all .25s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.section-title{font:600 11px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:20px 2px 10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2Z" fill="currentColor"/></svg></div>
  <div class="brand"><h1>ELEKTRA</h1><p id="tagline">Referensi Standar Kelistrikan</p></div>
  <div class="hspace"></div>
  <div class="pill-toggle" id="langToggle">
    <button data-lang="id" class="on">ID</button><button data-lang="en">EN</button>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="theme">
    <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main>
  <!-- ============ KONSULTASI ============ -->
  <section class="view active" id="view-ask">
    <div class="querybox">
      <label id="qLabel">Kueri Permasalahan Kelistrikan</label>
      <textarea id="qInput" rows="2" placeholder="Contoh: berapa resistansi pembumian maksimal untuk proteksi petir?"></textarea>
      <div class="qb-foot">
        <span class="src-note mono" id="srcNote">PUIL/SNI · IEC · NEC/NFPA</span>
        <button class="ask-btn" id="askBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2Z" fill="currentColor"/></svg>
          <span id="askLabel">Tanya</span>
        </button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="resultArea"></div>
  </section>

  <!-- ============ RIWAYAT ============ -->
  <section class="view" id="view-history">
    <div class="section-title" id="histTitle">Riwayat Konsultasi</div>
    <div id="histList"></div>
  </section>

  <!-- ============ ADMIN ============ -->
  <section class="view" id="view-admin">
    <!-- PIN gate -->
    <div id="adminLock">
      <div class="card" style="text-align:center">
        <h3 style="justify-content:center"><span class="dot"></span><span id="pinTitle">Mode Admin — Masukkan PIN</span></h3>
        <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
        <div class="pinpad" id="pinpad"></div>
      </div>
    </div>
    <!-- Panel -->
    <div id="adminPanel" style="display:none">
      <div class="card">
        <h3><span class="dot"></span><span id="stTitle">Statistik Pemakaian</span></h3>
        <div class="stats">
          <div class="stat"><div class="n" id="stTotal">0</div><div class="l" id="stTotalL">Total kueri</div></div>
          <div class="stat"><div class="n" id="stLocal">0</div><div class="l" id="stLocalL">Jawaban lokal (instan)</div></div>
          <div class="stat"><div class="n" id="stAI">0</div><div class="l" id="stAIL">Panggilan Gemini</div></div>
          <div class="stat"><div class="n" id="stAvg">–</div><div class="l" id="stAvgL">Rata-rata respons AI</div></div>
        </div>
      </div>
      <div style="height:12px"></div>
      <div class="card">
        <h3><span class="dot"></span><span id="kbTitle">Knowledge Base Lokal</span></h3>
        <div id="kbList"></div>
        <hr class="sep">
        <div class="field"><label id="fKw">Kata kunci (pisahkan koma)</label><input id="kbKw" placeholder="grounding, pembumian, arde"></div>
        <div class="field"><label id="fTitle">Judul topik</label><input id="kbT" placeholder="Resistansi pembumian proteksi petir"></div>
        <div class="field"><label>PUIL / SNI</label><textarea id="kbPuil" rows="2"></textarea></div>
        <div class="field"><label>IEC</label><textarea id="kbIec" rows="2"></textarea></div>
        <div class="field"><label>NEC / NFPA</label><textarea id="kbNec" rows="2"></textarea></div>
        <div class="field"><label id="fVerdict">Kesimpulan praktis</label><textarea id="kbVer" rows="2"></textarea></div>
        <button class="btn primary" id="kbAdd">＋ <span id="kbAddL">Tambah ke Knowledge Base</span></button>
      </div>
      <div style="height:12px"></div>
      <div class="card">
        <h3><span class="dot"></span><span id="setTitle">Pengaturan</span></h3>
        <div class="field"><label id="fPin">Ganti PIN (4 digit)</label><input id="newPin" inputmode="numeric" maxlength="4" placeholder="••••"></div>
        <div class="btnrow">
          <button class="btn ghost" id="savePin">💾 <span id="savePinL">Simpan PIN</span></button>
          <button class="btn ghost" id="exportBtn">⬇ <span id="exportL">Ekspor Data</span></button>
          <button class="btn danger" id="clearHist">🗑 <span id="clearL">Hapus Riwayat</span></button>
          <button class="btn ghost" id="lockBtn">🔒 <span id="lockL">Kunci Admin</span></button>
        </div>
      </div>
    </div>
  </section>
</main>

<nav><div class="nav-inner">
  <button data-view="ask" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2Z"/></svg>
    <span id="navAsk">Konsultasi</span></button>
  <button data-view="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    <span id="navHist">Riwayat</span></button>
  <button data-view="admin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <span id="navAdmin">Admin</span></button>
</div></nav>

<div class="toast" id="toast"></div>
</div>

<script>
/* ================= STATE & STORAGE ================= */
const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem('elektra_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set:(k,v)=>localStorage.setItem('elektra_'+k,JSON.stringify(v))
};
let lang = LS.get('lang','id');
let theme = LS.get('theme', matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
let history_ = LS.get('history',[]);
let stats = LS.get('stats',{total:0,local:0,ai:0,aiMs:[]});
let pin = LS.get('pin','1234');
let adminOpen = false;

/* ================= I18N ================= */
const T = {
  id:{tagline:'Referensi Standar Kelistrikan',qLabel:'Kueri Permasalahan Kelistrikan',
    ph:'Contoh: berapa resistansi pembumian maksimal untuk proteksi petir?',
    ask:'Tanya',asking:'Mencari…',navAsk:'Konsultasi',navHist:'Riwayat',navAdmin:'Admin',
    histTitle:'Riwayat Konsultasi',histEmpty:'Belum ada riwayat.\nMulai konsultasi pertama kamu.',
    localBadge:'JAWABAN LOKAL',aiBadge:'TERVERIFIKASI AI',verdict:'KESIMPULAN PRAKTIS',
    copied:'Disalin ke clipboard',respIn:'detik',
    pinTitle:'Mode Admin — Masukkan PIN',pinWrong:'PIN salah',
    stTitle:'Statistik Pemakaian',stTotalL:'Total kueri',stLocalL:'Jawaban lokal (instan)',
    stAIL:'Panggilan Gemini',stAvgL:'Rata-rata respons AI',
    kbTitle:'Knowledge Base Lokal',fKw:'Kata kunci (pisahkan koma)',fTitle:'Judul topik',
    fVerdict:'Kesimpulan praktis',kbAddL:'Tambah ke Knowledge Base',kbSaved:'Topik ditambahkan',
    kbDeleted:'Topik dihapus',kbIncomplete:'Lengkapi kata kunci, judul, dan minimal satu standar',
    setTitle:'Pengaturan',fPin:'Ganti PIN (4 digit)',savePinL:'Simpan PIN',pinSaved:'PIN diperbarui',
    pinInvalid:'PIN harus 4 digit angka',exportL:'Ekspor Data',clearL:'Hapus Riwayat',lockL:'Kunci Admin',
    histCleared:'Riwayat dihapus',confirmClear:'Hapus semua riwayat konsultasi?',
    errNet:'Gagal terhubung ke server AI. Periksa koneksi atau coba lagi.',
    errKey:'Server belum dikonfigurasi (GEMINI_API_KEY belum diisi di Vercel).',
    errQuota:'Kuota harian Gemini habis. Coba lagi besok, atau gunakan topik dari knowledge base lokal.',
    errBusy:'Model AI sedang sibuk, coba lagi dalam beberapa detik.',
    chips:['Grounding Proteksi Petir','KHA Kabel Motor','Stop Kontak Kamar Mandi']},
  en:{tagline:'Electrical Standards Reference',qLabel:'Electrical Issue Query',
    ph:'Example: what is the maximum grounding resistance for lightning protection?',
    ask:'Ask',asking:'Searching…',navAsk:'Consult',navHist:'History',navAdmin:'Admin',
    histTitle:'Consultation History',histEmpty:'No history yet.\nStart your first consultation.',
    localBadge:'LOCAL ANSWER',aiBadge:'AI VERIFIED',verdict:'PRACTICAL CONCLUSION',
    copied:'Copied to clipboard',respIn:'sec',
    pinTitle:'Admin Mode — Enter PIN',pinWrong:'Wrong PIN',
    stTitle:'Usage Statistics',stTotalL:'Total queries',stLocalL:'Local answers (instant)',
    stAIL:'Gemini calls',stAvgL:'Avg AI response',
    kbTitle:'Local Knowledge Base',fKw:'Keywords (comma separated)',fTitle:'Topic title',
    fVerdict:'Practical conclusion',kbAddL:'Add to Knowledge Base',kbSaved:'Topic added',
    kbDeleted:'Topic deleted',kbIncomplete:'Fill keywords, title, and at least one standard',
    setTitle:'Settings',fPin:'Change PIN (4 digits)',savePinL:'Save PIN',pinSaved:'PIN updated',
    pinInvalid:'PIN must be 4 digits',exportL:'Export Data',clearL:'Clear History',lockL:'Lock Admin',
    histCleared:'History cleared',confirmClear:'Delete all consultation history?',
    errNet:'Failed to reach AI server. Check connection and retry.',
    errKey:'Server not configured (GEMINI_API_KEY missing on Vercel).',
    errQuota:'Daily Gemini quota exhausted. Try again tomorrow, or use local knowledge base topics.',
    errBusy:'AI model is busy, please try again in a few seconds.',
    chips:['Lightning Protection Grounding','Motor Cable Ampacity','Bathroom Receptacle']}
};

/* ================= SEED KNOWLEDGE BASE ================= */
const SEED_KB = [

    nec:{summary:'NEC Art. 210.8(A)(1) requires GFCI protection for all 125V 15/20A bathroom receptacles, and Art. 210.52(D) requires at least one receptacle within 900 mm of the basin edge.',points:['US GFCI trip level: 4–6 mA (stricter than 30 mA RCD)','Dedicated 20A bathroom circuit (210.11(C)(3))'],refs:['NFPA 70 210.8','NFPA 70 210.52(D)']},
    verdict:'Safe practice in Indonesia: follow IEC/PUIL zoning — receptacles outside zone 2, all bathroom circuits through a 30 mA ELCB/RCD, and IPX4+ fittings in wet areas.'}}}
];
let kb = LS.get('kb', SEED_KB);

/* ================= FUSE ================= */
let fuse;
function buildFuse(){
  fuse = new Fuse(kb.map(e=>({...e, kws:e.keywords, ti:e.title.id, te:e.title.en})),
    {keys:['kws','ti','te'],threshold:0.34,ignoreLocation:true,minMatchCharLength:3});
}
buildFuse();

/* ================= HELPERS ================= */
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2200)}
function genId(){
  const d=new Date(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const seq=(history_.filter(h=>h.id.includes(ds)).length+1+'').padStart(4,'0');
  return `ELEC-${ds}-${seq}`;
}

/* ================= THEME & LANG ================= */
function applyTheme(){
  document.documentElement.dataset.theme=theme;
  $('#iconMoon').style.display=theme==='dark'?'':'none';
  $('#iconSun').style.display=theme==='light'?'':'none';
  document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#0D1117':'#F3F5F8';
  LS.set('theme',theme);
}
$('#themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme()};

function applyLang(){
  const t=T[lang];
  document.documentElement.lang=lang;
  $('#tagline').textContent=t.tagline; $('#qLabel').textContent=t.qLabel;
  $('#qInput').placeholder=t.ph; $('#askLabel').textContent=t.ask;
  $('#navAsk').textContent=t.navAsk; $('#navHist').textContent=t.navHist; $('#navAdmin').textContent=t.navAdmin;
  $('#histTitle').textContent=t.histTitle; $('#pinTitle').textContent=t.pinTitle;
  $('#stTitle').textContent=t.stTitle; $('#stTotalL').textContent=t.stTotalL;
  $('#stLocalL').textContent=t.stLocalL; $('#stAIL').textContent=t.stAIL; $('#stAvgL').textContent=t.stAvgL;
  $('#kbTitle').textContent=t.kbTitle; $('#fKw').textContent=t.fKw; $('#fTitle').textContent=t.fTitle;
  $('#fVerdict').textContent=t.fVerdict; $('#kbAddL').textContent=t.kbAddL;
  $('#setTitle').textContent=t.setTitle; $('#fPin').textContent=t.fPin; $('#savePinL').textContent=t.savePinL;
  $('#exportL').textContent=t.exportL; $('#clearL').textContent=t.clearL; $('#lockL').textContent=t.lockL;
  $$('#langToggle button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  renderChips(); renderHistory(); renderKB();
  LS.set('lang',lang);
}
$$('#langToggle button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyLang()});

/* ================= NAV ================= */
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+b.dataset.view).classList.add('active');
  if(b.dataset.view==='history')renderHistory();
  if(b.dataset.view==='admin')renderAdmin();
  window.scrollTo({top:0});
});

/* ================= CHIPS ================= */
function renderChips(){
  $('#chips').innerHTML = kb.slice(0,4).map(e=>
    `<button class="chip" data-kb="${e.id}"><span class="zap">⚡</span>${esc(e.title[lang]||e.title.id)}</button>`).join('');
  $$('#chips .chip').forEach(c=>c.onclick=()=>{
    const e=kb.find(x=>x.id===c.dataset.kb);
    $('#qInput').value=e.title[lang]||e.title.id;
    ask();
  });
}

/* ================= ASK FLOW ================= */
const askBtn=$('#askBtn'), qInput=$('#qInput'), resultArea=$('#resultArea');
qInput.addEventListener('input',()=>{qInput.style.height='auto';qInput.style.height=Math.min(qInput.scrollHeight,140)+'px'});
qInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
askBtn.onclick=()=>ask();

function skeleton(){
  return `<div class="cards skel" style="margin-top:16px">
    ${[1,2,3].map(()=>`<div class="std-card" style="--c:var(--line)">
      <div class="sk" style="height:20px;width:130px;margin-bottom:12px"></div>
      <div class="sk" style="height:12px;width:100%;margin-bottom:7px"></div>
      <div class="sk" style="height:12px;width:92%;margin-bottom:7px"></div>
      <div class="sk" style="height:12px;width:70%"></div></div>`).join('')}
  </div>`;
}

async function ask(){
  const q=qInput.value.trim();
  if(!q||askBtn.disabled)return;
  const t=T[lang];
  askBtn.disabled=true; $('#askLabel').textContent=t.asking;
  const t0=performance.now();

  // 1) local KB via Fuse
  const hit=fuse.search(q)[0];
  let record;
  if(hit && hit.score<=0.34){
    const e=hit.item, d=e.data[lang]||e.data.id;
    record={id:genId(),ts:Date.now(),q,src:'local',ms:Math.round(performance.now()-t0),lang,ans:d};
    stats.total++;stats.local++;
    finishAsk(record);
  }else{
    resultArea.innerHTML=skeleton();
    try{
      const apiBase = location.protocol==='file:' ? 'https://app-six-tawny-91.vercel.app' : '';
      const r=await fetch(apiBase+'/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query:q,lang})});
      const j=await r.json();
      if(!r.ok){
        const msg = r.status===500&&j.error==='no_key' ? t.errKey : r.status===429 ? t.errQuota : r.status===503 ? t.errBusy : (j.error||t.errNet);
        throw new Error(msg);
      }
      record={id:genId(),ts:Date.now(),q,src:'ai',ms:Math.round(performance.now()-t0),lang,ans:j};
      stats.total++;stats.ai++;stats.aiMs.push(record.ms);if(stats.aiMs.length>50)stats.aiMs.shift();
      finishAsk(record);
    }catch(err){
      resultArea.innerHTML=`<div class="errbox" style="margin-top:16px">${esc(err.message||t.errNet)}</div>`;
    }
  }
  LS.set('stats',stats);
  askBtn.disabled=false;$('#askLabel').textContent=t.ask;
}

function finishAsk(record){
  history_.unshift(record); if(history_.length>200)history_.pop();
  LS.set('history',history_);
  renderResult(record);
}

function cardHTML(cls,tag,d){
  if(!d||(!d.summary&&!(d.points||[]).length))return'';
  return `<div class="std-card ${cls}">
    <div class="std-head"><span class="std-tag">${tag}</span>
      <button class="copy-btn" data-copy="${cls}" aria-label="copy">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button></div>
    ${d.summary?`<p class="sum">${esc(d.summary)}</p>`:''}
    ${(d.points&&d.points.length)?`<ul>${d.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
    ${(d.refs&&d.refs.length)?`<div class="refs">${d.refs.map(r=>`<span class="ref">${esc(r)}</span>`).join('')}</div>`:''}
  </div>`;
}

function renderResult(rec){
  const t=T[lang], a=rec.ans;
  resultArea.innerHTML=`
    <div class="result-meta">
      <span class="rid">${rec.id}</span>
      <span class="badge ${rec.src==='local'?'local':'ai'}">${rec.src==='local'?t.localBadge:t.aiBadge}</span>
      <span class="rtime">${(rec.ms/1000).toFixed(2)} ${t.respIn}</span>
    </div>
    <div class="cards">
      ${cardHTML('puil','STANDARD PUIL / SNI',a.puil)}
      ${cardHTML('iec','STANDARD IEC',a.iec)}
      ${cardHTML('nec','STANDARD NEC / NFPA',a.nec)}
      ${a.verdict?`<div class="verdict"><b>${t.verdict}</b>${esc(a.verdict)}</div>`:''}
    </div>`;
  $$('#resultArea .copy-btn').forEach(b=>b.onclick=()=>{
    const key=b.dataset.copy, d=a[key];
    const txt=[d.summary,...(d.points||[]).map(p=>'• '+p),(d.refs||[]).join(', ')].filter(Boolean).join('\n');
    navigator.clipboard.writeText(txt).then(()=>toast(t.copied));
  });
  resultArea.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ================= HISTORY ================= */
function renderHistory(){
  const t=T[lang];
  if(!history_.length){$('#histList').innerHTML=`<div class="empty">${t.histEmpty.replace('\n','<br>')}</div>`;return}
  $('#histList').innerHTML=history_.map((h,i)=>`
    <div class="hitem" data-i="${i}">
      <div class="top"><span class="hid">${h.id}</span>
        <span class="badge ${h.src==='local'?'local':'ai'}" style="font-size:8.5px">${h.src==='local'?'⚡':'AI'}</span>
        <span class="hdate">${new Date(h.ts).toLocaleString(lang==='id'?'id-ID':'en-US',{dateStyle:'short',timeStyle:'short'})}</span></div>
      <div class="hq">${esc(h.q)}</div>
    </div>`).join('');
  $$('#histList .hitem').forEach(el=>el.onclick=()=>{
    const rec=history_[+el.dataset.i];
    $$('nav button').forEach(x=>x.classList.toggle('on',x.dataset.view==='ask'));
    $$('.view').forEach(v=>v.classList.remove('active'));
    $('#view-ask').classList.add('active');
    qInput.value=rec.q; renderResult(rec); window.scrollTo({top:0});
  });
}

/* ================= ADMIN ================= */
let pinBuf='';
function renderPinpad(){
  const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('#pinpad').innerHTML=keys.map(k=>`<button data-k="${k}" ${k===''?'style="visibility:hidden"':''}>${k}</button>`).join('');
  $$('#pinpad button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==='⌫')pinBuf=pinBuf.slice(0,-1);
    else if(pinBuf.length<4)pinBuf+=k;
    $$('#pinDots span').forEach((d,i)=>d.classList.toggle('f',i<pinBuf.length));
    if(pinBuf.length===4){
      if(pinBuf===pin){adminOpen=true;pinBuf='';renderAdmin()}
      else{toast(T[lang].pinWrong);pinBuf='';setTimeout(()=>$$('#pinDots span').forEach(d=>d.classList.remove('f')),250)}
    }
  });
}
function renderAdmin(){
  $('#adminLock').style.display=adminOpen?'none':'';
  $('#adminPanel').style.display=adminOpen?'':'none';
  if(!adminOpen){renderPinpad();$$('#pinDots span').forEach(d=>d.classList.remove('f'));return}
  $('#stTotal').textContent=stats.total;
  $('#stLocal').textContent=stats.local;
  $('#stAI').textContent=stats.ai;
  $('#stAvg').textContent=stats.aiMs.length?(stats.aiMs.reduce((a,b)=>a+b,0)/stats.aiMs.length/1000).toFixed(1)+'s':'–';
  renderKB();
}
function renderKB(){
  if(!adminOpen)return;
  $('#kbList').innerHTML=kb.map(e=>`
    <div class="kbrow"><div style="flex:1">
      <div class="t">${esc(e.title[lang]||e.title.id)}</div>
      <div class="kw mono">${esc(e.keywords)}</div></div>
      <button class="btn danger" style="padding:6px 10px;font-size:11px" data-del="${e.id}">✕</button>
    </div>`).join('');
  $$('#kbList [data-del]').forEach(b=>b.onclick=()=>{
    kb=kb.filter(x=>x.id!==b.dataset.del);LS.set('kb',kb);buildFuse();renderKB();renderChips();toast(T[lang].kbDeleted);
  });
}
$('#kbAdd').onclick=()=>{
  const kw=$('#kbKw').value.trim(),ti=$('#kbT').value.trim();
  const p=$('#kbPuil').value.trim(),i=$('#kbIec').value.trim(),n=$('#kbNec').value.trim(),v=$('#kbVer').value.trim();
  if(!kw||!ti||(!p&&!i&&!n)){toast(T[lang].kbIncomplete);return}
  const data={puil:p?{summary:p,points:[],refs:[]}:null,iec:i?{summary:i,points:[],refs:[]}:null,
    nec:n?{summary:n,points:[],refs:[]}:null,verdict:v};
  kb.push({id:'kb'+Date.now(),keywords:kw,title:{id:ti,en:ti},data:{id:data,en:data}});
  LS.set('kb',kb);buildFuse();renderKB();renderChips();
  ['kbKw','kbT','kbPuil','kbIec','kbNec','kbVer'].forEach(x=>$('#'+x).value='');
  toast(T[lang].kbSaved);
};
$('#savePin').onclick=()=>{
  const v=$('#newPin').value.trim();
  if(!/^\d{4}$/.test(v)){toast(T[lang].pinInvalid);return}
  pin=v;LS.set('pin',pin);$('#newPin').value='';toast(T[lang].pinSaved);
};
$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({history:history_,kb,stats},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='elektra-export-'+new Date().toISOString().slice(0,10)+'.json';a.click();
};
$('#clearHist').onclick=()=>{
  if(!confirm(T[lang].confirmClear))return;
  history_=[];LS.set('history',history_);renderHistory();renderAdmin();toast(T[lang].histCleared);
};
$('#lockBtn').onclick=()=>{adminOpen=false;renderAdmin()};

/* ================= INIT ================= */
applyTheme();applyLang();renderPinpad();
</script>
</body>
</html>
